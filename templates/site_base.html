<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}gummietech{% endblock %}</title>
<meta name="description" content="{% block description %}Sources and full explanations for every @gummietech carousel.{% endblock %}">
<style>
/* ============================================================
   gummietech — web archive.

   The page the Instagram bio links to. Instagram does not make
   caption URLs clickable, so this is the only place a viewer
   can actually reach the source a carousel was built from.

   Built by src/site.py from posts/*.json. Same tokens as the
   slides (templates/tokens.css) so the two read as one account.

   Fonts are self-hosted from ./fonts, copied in by site.py, for
   the same reason drop.html avoids the CDN. font-display differs
   though: the slides use `block` because a screenshot taken in a
   fallback face is silently wrong, while a web reader is better
   served by `swap` than by invisible text.
   ============================================================ */

@font-face {
  font-family: 'Outfit';
  src: url('{{ base }}fonts/Outfit.ttf') format('truetype');
  font-weight: 100 900;
  font-display: swap;
}
@font-face {
  font-family: 'Figtree';
  src: url('{{ base }}fonts/Figtree.ttf') format('truetype');
  font-weight: 300 900;
  font-display: swap;
}

{% include 'tokens.css' %}

/* --accent is the post's lead hue, set inline per element from the
   colorway. Like --lead on the slides it only ever comes from the
   COLORWAYS allowlist in render.py, never straight from the draft
   JSON — Jinja autoescaping guards HTML, not CSS. */

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--cream);
  color: var(--ink);
  font-family: var(--body);
  font-weight: 500;
  font-size: 18px;
  line-height: 1.55;
  -webkit-text-size-adjust: 100%;
}

a { color: inherit; }

.wrap { max-width: 660px; margin: 0 auto; padding: 30px 18px 80px; }

/* ---------- masthead ---------- */
.masthead { margin-bottom: 34px; }
.mark {
  font-family: var(--display); font-weight: 800;
  font-size: 27px; letter-spacing: -0.035em; text-decoration: none;
}
.tagline { font-size: 15px; opacity: 0.72; margin-top: 4px; max-width: 44ch; }

/* ---------- the signature frame ----------
   The slides carry a 10px --ink border at 44px radius, inset from a
   1080px canvas. Scaled to a 660px column that is 4px at 26px: the
   same shape, not the same numbers. */
.panel {
  border: 4px solid var(--ink);
  border-radius: 26px;
  padding: 26px 24px;
  background: var(--accent, var(--cream));
  transition: transform 0.12s ease;
}

.meta {
  font-family: var(--body); font-weight: 700;
  font-size: 13px; letter-spacing: 0.09em;
  text-transform: uppercase; opacity: 0.68;
}

.hook {
  font-family: var(--display); font-weight: 800;
  line-height: 1.02; letter-spacing: -0.035em;
  text-wrap: balance;
}

/* ---------- index ---------- */
.entry { display: block; text-decoration: none; margin-bottom: 18px; }
.entry .hook { font-size: 30px; margin-top: 8px; }
.entry:hover .panel, .entry:focus-visible .panel { transform: translateY(-2px); }
.empty { opacity: 0.7; }

/* ---------- post ---------- */
.back { font-size: 15px; font-weight: 700; text-decoration: none; opacity: 0.7; }
.back:hover { opacity: 1; }
.hero { margin-bottom: 34px; }
.hero .hook { font-size: 38px; margin-top: 10px; }
.section { margin: 30px 0; }
.section h2 {
  font-family: var(--display); font-weight: 800;
  font-size: 21px; letter-spacing: -0.025em; margin-bottom: 6px;
}
.section p { max-width: 42ch; }

/* ---------- source ---------- */
.source {
  border-top: 4px solid var(--ink);
  padding-top: 22px; margin-top: 44px;
  font-size: 16px;
}
.source dt {
  font-family: var(--body); font-weight: 700;
  font-size: 13px; letter-spacing: 0.09em;
  text-transform: uppercase; opacity: 0.68; margin-top: 14px;
}
.source dd { margin: 2px 0 0; overflow-wrap: anywhere; }
.source a { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 2px; }

/* Mirrors .flag on the slides. §7.2 — a preprint is labelled in the
   template, not by convention, here as well as on slide 4. */
.flag {
  display: inline-block;
  background: var(--ink); color: var(--cream);
  font-family: var(--body); font-weight: 700;
  font-size: 13px; padding: 7px 14px; border-radius: 999px;
  margin-bottom: 14px;
}

.foot { margin-top: 60px; font-size: 15px; opacity: 0.7; }

@media (min-width: 560px) {
  .hero .hook { font-size: 50px; }
  .entry .hook { font-size: 34px; }
}
@media (prefers-reduced-motion: reduce) {
  .panel { transition: none; }
  .entry:hover .panel, .entry:focus-visible .panel { transform: none; }
}
</style>
</head>
<body>
<div class="wrap">
{% block content %}{% endblock %}
  <p class="foot">
    <a href="https://www.instagram.com/gummietech/">@gummietech</a> —
    science, technology and engineering, explained by someone whose code
    also crashes.
  </p>
</div>
</body>
</html>
